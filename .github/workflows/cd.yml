name: Despliegue continuo

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  pruebas:
    name: Verificar la aplicación
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

  publicar-imagen:
    name: Construir y publicar imagen Docker
    needs: pruebas
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.datos.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Preparar nombre de imagen
        id: datos
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Iniciar sesión en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construir y publicar imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.datos.outputs.image }}

  desplegar:
    name: Desplegar en Amazon EC2
    needs: publicar-imagen
    runs-on: ubuntu-latest
    steps:
      - name: Ejecutar despliegue remoto y comprobar versión
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE: ${{ needs.publicar-imagen.outputs.image }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE
          script: |
            set -eu
            cd /opt/libros-api
            chmod +x deploy.sh
            ./deploy.sh "$IMAGE"
